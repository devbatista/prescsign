# Config de assinatura EVALCryptoCubo, compartilhada entre web e sidekiq.
# Os valores vêm do .env (docker-compose interpola ${...} a partir dele).
# WKHTMLTOPDF_PATH é fixado no binário do container (/usr/bin/wkhtmltopdf, do
# Dockerfile) para SOBRESCREVER o path de host que o dotenv carregaria do .env
# montado — o dotenv não sobrepõe env já definida pelo SO.
x-eval-signature-env: &eval_signature_env
  WKHTMLTOPDF_PATH: /usr/bin/wkhtmltopdf
  SIGNATURE_PROVIDER: ${SIGNATURE_PROVIDER:-internal}
  EVAL_CRYPTO_CUBO_BASE_URL: ${EVAL_CRYPTO_CUBO_BASE_URL}
  EVAL_CRYPTO_CUBO_API_KEY: ${EVAL_CRYPTO_CUBO_API_KEY}
  EVAL_CRYPTO_CUBO_OPERATOR_ID: ${EVAL_CRYPTO_CUBO_OPERATOR_ID}
  EVAL_CRYPTO_CUBO_TYPE: ${EVAL_CRYPTO_CUBO_TYPE:-qualified}
  EVAL_CRYPTO_CUBO_FORMAT: ${EVAL_CRYPTO_CUBO_FORMAT:-detached}
  EVAL_CRYPTO_CUBO_PROFILE: ${EVAL_CRYPTO_CUBO_PROFILE}
  EVAL_CRYPTO_CUBO_ICPBR: ${EVAL_CRYPTO_CUBO_ICPBR:-false}
  EVAL_CRYPTO_CUBO_ALIAS: ${EVAL_CRYPTO_CUBO_ALIAS}
  EVAL_CRYPTO_CUBO_USE_CONFIG_ALIAS: ${EVAL_CRYPTO_CUBO_USE_CONFIG_ALIAS:-false}
  EVAL_CRYPTO_CUBO_PIN: ${EVAL_CRYPTO_CUBO_PIN}
  EVAL_CRYPTO_CUBO_VERIFY_TYPE: ${EVAL_CRYPTO_CUBO_VERIFY_TYPE}
  EVAL_CRYPTO_CUBO_VERIFY_FORMAT: ${EVAL_CRYPTO_CUBO_VERIFY_FORMAT}
  EVAL_CRYPTO_CUBO_VERIFY_SIGNER: ${EVAL_CRYPTO_CUBO_VERIFY_SIGNER}
  EVAL_CRYPTO_CUBO_VERIFY_PACKAGE: ${EVAL_CRYPTO_CUBO_VERIFY_PACKAGE}
  EVAL_CRYPTO_CUBO_TIMEOUT_SECONDS: ${EVAL_CRYPTO_CUBO_TIMEOUT_SECONDS:-30}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_DEVELOPMENT:-prescsign_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT_HOST:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    entrypoint: ["/rails/bin/docker-entrypoint"]
    environment:
      <<: *eval_signature_env
      RAILS_ENV: development
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-debug}
      APP_HOST: ${APP_HOST:-localhost}
      APP_PORT: ${APP_PORT:-3000}
      APP_PROTOCOL: ${APP_PROTOCOL:-http}
      WAIT_FOR_DEPENDENCIES: ${WAIT_FOR_DEPENDENCIES:-true}
      WAIT_FOR_SERVICES_TIMEOUT: ${WAIT_FOR_SERVICES_TIMEOUT:-60}
      WAIT_FOR_SERVICES_SLEEP: ${WAIT_FOR_SERVICES_SLEEP:-2}
      RUN_DB_PREPARE: "true"
      ACTIVE_JOB_QUEUE_ADAPTER: ${ACTIVE_JOB_QUEUE_ADAPTER:-sidekiq}
      REDIS_URL: redis://redis:6379/1
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB_DEVELOPMENT: ${POSTGRES_DB_DEVELOPMENT:-prescsign_development}
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    ports:
      - "${WEB_PORT_HOST:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT_HOST:-8080}:80"

  sidekiq:
    build:
      context: .
      args:
        BUNDLE_WITHOUT: ""
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      <<: *eval_signature_env
      RAILS_ENV: development
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-debug}
      WAIT_FOR_DEPENDENCIES: ${WAIT_FOR_DEPENDENCIES:-true}
      WAIT_FOR_SERVICES_TIMEOUT: ${WAIT_FOR_SERVICES_TIMEOUT:-60}
      WAIT_FOR_SERVICES_SLEEP: ${WAIT_FOR_SERVICES_SLEEP:-2}
      RUN_DB_PREPARE: "false"
      REDIS_URL: redis://redis:6379/1
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB_DEVELOPMENT: ${POSTGRES_DB_DEVELOPMENT:-prescsign_development}
    volumes:
      - .:/rails
      - bundle_data:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  bundle_data:
