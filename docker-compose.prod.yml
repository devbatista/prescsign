# Storage dos PDFs assinados, compartilhado entre web e sidekiq. Em produção os
# containers sobem com `volumes: []`, então o service `local` grava na camada
# efêmera do container: o registro do blob sobrevive no Postgres (volume
# nomeado) mas o arquivo some no próximo deploy, e o download quebra com
# ActiveStorage::FileNotFoundError. Por isso produção deve usar `s3`.
# Os dois serviços precisam da MESMA config: o web serve o download e o sidekiq
# toca nos anexos — apontar só um deles para o S3 quebra de forma intermitente.
x-object-storage-env: &object_storage_env
  ACTIVE_STORAGE_SERVICE: ${ACTIVE_STORAGE_SERVICE:-s3}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_REGION: ${S3_REGION:-sa-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  db:
    ports: []
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PRODUCTION:-prescsign_production}

  redis:
    ports: []

  web:
    command: bundle exec puma -C config/puma.rb
    environment:
      <<: *object_storage_env
      RAILS_ENV: production
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      APP_HOST: ${APP_HOST:-app.prescsign.local}
      APP_PROTOCOL: ${APP_PROTOCOL:-https}
      WAIT_FOR_DEPENDENCIES: ${WAIT_FOR_DEPENDENCIES:-true}
      WAIT_FOR_SERVICES_TIMEOUT: ${WAIT_FOR_SERVICES_TIMEOUT:-60}
      WAIT_FOR_SERVICES_SLEEP: ${WAIT_FOR_SERVICES_SLEEP:-2}
      RUN_DB_PREPARE: "true"
      ACTIVE_JOB_QUEUE_ADAPTER: ${ACTIVE_JOB_QUEUE_ADAPTER:-sidekiq}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB_PRODUCTION: ${POSTGRES_DB_PRODUCTION:-prescsign_production}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${WEB_PORT_HOST:-3000}:3000"
    volumes: []

  sidekiq:
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      <<: *object_storage_env
      RAILS_ENV: production
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      WAIT_FOR_DEPENDENCIES: ${WAIT_FOR_DEPENDENCIES:-true}
      WAIT_FOR_SERVICES_TIMEOUT: ${WAIT_FOR_SERVICES_TIMEOUT:-60}
      WAIT_FOR_SERVICES_SLEEP: ${WAIT_FOR_SERVICES_SLEEP:-2}
      RUN_DB_PREPARE: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB_PRODUCTION: ${POSTGRES_DB_PRODUCTION:-prescsign_production}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes: []
